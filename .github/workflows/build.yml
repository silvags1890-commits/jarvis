name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet buildozer cython google-genai gtts SpeechRecognition

    - name: Initialize Buildozer
      run: |
        buildozer init || true
        sed -i 's/# title =.*/title = J.A.R.V.I.S./' buildozer.spec
        sed -i 's/# package.name =.*/package.name = jarvis/' buildozer.spec
        sed -i 's/# package.domain =.*/package.domain = org.stark/' buildozer.spec
        sed -i 's/# source.include_exts =.*/source.include_exts = py,png,jpg,kv,atlas/' buildozer.spec
        sed -i 's/# requirements =.*/requirements = python3,flet,google-genai,gtts,SpeechRecognition,requests,urllib3,certifi,idna,charset-normalizer/' buildozer.spec
        sed -i 's/# orientation =.*/orientation = portrait/' buildozer.spec
        sed -i 's/# android.permissions =.*/android.permissions = INTERNET,RECORD_AUDIO/' buildozer.spec

    - name: Build APK with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
